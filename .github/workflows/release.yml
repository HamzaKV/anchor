name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node ./dist/bin/main.js status || true
      - run: npm install -g npm@^11 # trusted publishing (OIDC) needs npm >=11.5.1; npm@latest (12.x) requires Node >=22
      - run: npm publish --provenance
        working-directory: ./dist
